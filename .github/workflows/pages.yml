name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "img/debug.png"
      - "img/die.png"
      - "img/mode-vector.png"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p public/img
          cp site/index.html site/style.css site/main.js site/compat.js site/compat_data.json public/
          cp img/debug.png img/die.png img/mode-vector.png public/img/
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
